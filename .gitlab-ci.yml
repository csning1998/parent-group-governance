---
include:
  - local: .gitlab/ci/modules-terraform.yml
  - component: $CI_SERVER_FQDN/$CI_PROJECT_ROOT_NAMESPACE/gitlab-ci-with-code-reviewer/core@1.8.3
    inputs:
      reviewer_image: $CI_REGISTRY/$CI_PROJECT_ROOT_NAMESPACE/gitlab-ci-with-code-reviewer/reviewer:1.8.3
      review_models:
        - "claude-sonnet-5.5"
        - "claude-opus-5.5"
        - "gemini-4-carbon"
        - "gemini-4-argon"
        - "gemini-3.8-flash"
        - "azure-gpt-5.4-mini"
      enable_sonarqube: true
      # The group runner carries the tag and reaches SonarQube on the host network sonarqube-ci-net.
      sonar_scanner_tags: ["sonarqube-network"]
      sonar_go_coverage_path: "tools/governance/coverage.out"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_ROOT_NAMESPACE/gitlab-ci-with-code-reviewer/iac-terraform@1.8.3
    inputs:
      # CKV_GLB_1, CKV_GLB_3, CKV_GLB_4: require GitLab Premium/Ultimate merge request approval and push rules.
      # CKV_TF_1: enforces commit-pinned Git URLs. Modules use immutable semantic versions from GitLab Terraform Registry.
      checkov_skip: "CKV_GLB_1,CKV_GLB_3,CKV_GLB_4,CKV_TF_1"
  - component: $CI_SERVER_FQDN/$CI_PROJECT_ROOT_NAMESPACE/gitlab-ci-with-code-reviewer/iac-ansible@1.8.3
    inputs:
      ansible_globs: ["ansible/**/*"]
  - component: $CI_SERVER_FQDN/$CI_PROJECT_ROOT_NAMESPACE/gitlab-ci-with-code-reviewer/lang-go@1.8.3
    inputs:
      go_image: "golang:1.27-alpine" # ML-DSA certificate handling MUST build with Go 1.27
      golangci_image: "golangci/golangci-lint:v2.15.0-alpine"
      go_dir: "tools/governance"
      go_fmt_path: "./tools/governance"
      go_globs:
        [
          "tools/governance/**/*.go",
          "tools/governance/go.mod",
          "tools/governance/go.sum",
        ]
  - component: $CI_SERVER_FQDN/$CI_PROJECT_ROOT_NAMESPACE/gitlab-ci-with-code-reviewer/auto-tag@1.8.3
    inputs:
      reviewer_image: $CI_REGISTRY/$CI_PROJECT_ROOT_NAMESPACE/gitlab-ci-with-code-reviewer/reviewer:1.8.3

test:go:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Keeps coverage paths relative to the repository root for SonarQube to resolve against sonar.sources.
test:python:
  stage: test
  image: docker.io/library/python:3.14-alpine
  interruptible: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pip install --no-cache-dir pytest pytest-cov
    - printf '[run]\nrelative_files = True\n' > .coveragerc
    - >-
      pytest -q -p no:cacheprovider ansible/roles/workstation_vault_audit/tests
      --cov=ansible/roles/workstation_vault_audit/files --cov-config=.coveragerc --cov-report=xml:coverage.xml
  artifacts:
    when: always
    paths:
      - coverage.xml
    expire_in: 1 day

security:sonarqube:
  needs:
    - job: test:go
      optional: true
    - job: test:python
      optional: true
