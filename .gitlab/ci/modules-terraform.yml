---
# Isolates module publication pipelines by module_name to prevent job name collisions across shared CI components.
include:
  - component: $CI_SERVER_FQDN/csning1998/gitlab-ci-with-code-reviewer/iac-terraform-module@1.6.2
    inputs:
      # Scopes publishing path to the module directory to isolate module artifacts
      # from repository-level governance configurations.
      module_dir: "${CI_PROJECT_DIR}/terraform/modules/project-baseline"
      module_name: "project-baseline"
      module_system: "gitlab"
      tag_prefix: "project-baseline-"
  - component: $CI_SERVER_FQDN/csning1998/gitlab-ci-with-code-reviewer/iac-terraform-module@1.6.2
    inputs:
      module_dir: "${CI_PROJECT_DIR}/terraform/modules/vault-credential"
      module_name: "vault-credential"
      module_system: "gitlab"
      tag_prefix: "vault-credential-"
