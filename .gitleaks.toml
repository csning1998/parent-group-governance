[extend]
useDefault = true

[[allowlists]]
description = "Documentation placeholders which are not real credential"
regexTarget = "line"
regexes = [
  '''replace-corresponding''',
  '''replace-corresponding-placeholder-(token|api-key)''',
]

[[allowlists]]
description = "JDBC connection URLs carry host, port and database name only. Credentials are injected separately through KC_DB_USERNAME and KC_DB_PASSWORD."
targetRules = ["generic-api-key"]
paths = [
  '''ansible/roles/(shared|platform)_keycloak/templates/keycloak\.env\.j2$''',
]
regexes = ['''jdbc:postgresql://[^\s"']+''']
