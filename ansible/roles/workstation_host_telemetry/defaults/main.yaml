---
# Required role inputs (meta/argument_specs.yml):
# workstation_host_telemetry_{scrape_cidr,scrape_ip,vault_bastion,host_telemetry_scrape}.

# Combines the HAProxy Vault metrics port with the host exporter ports from the scrape configuration.
workstation_host_telemetry_scrape_ports: >-
  {{
    [workstation_host_telemetry_vault_bastion.metrics_port] +
    (workstation_host_telemetry_host_telemetry_scrape.host_exporter_ports | default([]))
  }}
