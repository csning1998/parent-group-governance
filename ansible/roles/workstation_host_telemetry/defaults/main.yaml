---
# Required role inputs (meta/argument_specs.yml):
# workstation_host_telemetry_{scrape_cidr,scrape_ip,vault_bastion,host_telemetry_scrape,host_log_rendezvous}.

# Operator account granted textfile collector ACL and owning Grafana Alloy directories.
workstation_host_telemetry_operator_user: ""
workstation_host_telemetry_repository: ""
workstation_host_telemetry_log_rendezvous_cidr: ""
workstation_host_telemetry_log_rendezvous_ip: ""
workstation_host_telemetry_log_rendezvous_server_names: []
workstation_host_telemetry_pki_root_ca_pem: ""

# Combines the HAProxy Vault metrics port with the host exporter ports from the scrape configuration.
workstation_host_telemetry_scrape_ports: >-
  {{
    [workstation_host_telemetry_vault_bastion.metrics_port] +
    (workstation_host_telemetry_host_telemetry_scrape.host_exporter_ports | default([]))
  }}
