---
- name: "Section 0. Require the injected segment and the workstation topology"
  ansible.builtin.assert:
    that:
      - workstation_host_telemetry_scrape_cidr is match('^\d{1,3}(\.\d{1,3}){3}/\d{1,2}$')
      - workstation_host_telemetry_scrape_ip is match('^\d{1,3}(\.\d{1,3}){3}$')
      - workstation_host_telemetry_vault_bastion is mapping
      - workstation_host_telemetry_host_telemetry_scrape is mapping
      - workstation_host_telemetry_host_log_rendezvous is mapping
    fail_msg: >-
      Invalid workstation_host_telemetry inputs.
      The CLI injects workstation_host_telemetry_{scrape_cidr, scrape_ip}.
      group_vars/all/ maps workstation_host_telemetry_{vault_bastion, host_telemetry_scrape, host_log_rendezvous}.

# Binds the scrape gateway IP to a dedicated routed bridge, allowing scraper guests to reach host listeners without NAT.
- name: "A1. Define the host telemetry scrape network"
  community.libvirt.virt_net:
    uri: qemu:///system
    command: define
    name: "{{ workstation_host_telemetry_host_telemetry_scrape.network_name }}"
    xml: "{{ lookup('template', 'host-telemetry-network.xml.j2') }}"

- name: "A2. Ensure the host telemetry scrape network is active"
  community.libvirt.virt_net:
    uri: qemu:///system
    state: active
    name: "{{ workstation_host_telemetry_host_telemetry_scrape.network_name }}"

- name: "A3. Ensure the host telemetry scrape network autostarts"
  community.libvirt.virt_net:
    uri: qemu:///system
    autostart: true
    name: "{{ workstation_host_telemetry_host_telemetry_scrape.network_name }}"

# Priority -2 evaluates before libvirt-to-host (priority -1, target REJECT), admitting traffic from the scrape
# subnet before general guest traffic is rejected.
- name: "B1. Declare the policy for scraper traffic to the host"
  ansible.builtin.template:
    src: host-telemetry-to-host.xml.j2
    dest: /etc/firewalld/policies/host-telemetry-to-host.xml
    owner: root
    group: root
    mode: "0644"
  register: _workstation_host_telemetry_policy_file

- name: "B2. Reload firewalld to reconcile runtime state with the permanent configuration"
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: false

- name: "B3. Read the runtime policy for scraper traffic to the host"
  ansible.builtin.command:
    cmd: firewall-cmd --info-policy=host-telemetry-to-host
  register: _workstation_host_telemetry_policy_info
  check_mode: false
  changed_when: false
  when: not (ansible_check_mode and _workstation_host_telemetry_policy_file.changed)

- name: "B4. Assert each scrape port admits the segment once"
  ansible.builtin.assert:
    that:
      - (_workstation_host_telemetry_policy_info.stdout | regex_findall('port="' ~ item ~ '"') | length) == 1
    fail_msg: >-
      The runtime policy host-telemetry-to-host admits port {{ item }} other than once. Compare against the rendered
      host-telemetry-to-host.xml.j2 and rerun B1 and B2.
  loop: "{{ workstation_host_telemetry_scrape_ports }}"
  when: not (ansible_check_mode and _workstation_host_telemetry_policy_file.changed)

# Persisting the scrape IP in /etc/ansible/facts.d ensures subsequent workstation_libvirt runs retain the
# telemetry terminator configuration.
- name: "C1. Create the directory of the local facts"
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "C2. Record the host address on the scrape segment as a local fact"
  ansible.builtin.copy:
    content: "{{ {'scrape_ip': workstation_host_telemetry_scrape_ip} | to_nice_json }}\n"
    dest: /etc/ansible/facts.d/host_telemetry.fact
    owner: root
    group: root
    mode: "0644"

- name: "C3. Read the local facts"
  ansible.builtin.setup:
    filter: ansible_local

- name: "C4. Grant the operator write access to the textfile collector directory"
  ansible.posix.acl:
    path: "{{ workstation_host_telemetry_host_telemetry_scrape.textfile_collector_dir }}"
    entity: "{{ workstation_host_telemetry_operator_user }}"
    etype: user
    permissions: rwx
    state: present
  when:
    - workstation_host_telemetry_operator_user | length > 0
    - workstation_host_telemetry_host_telemetry_scrape.textfile_collector_dir | default('') | length > 0

- name: "C5. Grant prometheus default read access on newly created textfile metrics"
  ansible.posix.acl:
    path: "{{ workstation_host_telemetry_host_telemetry_scrape.textfile_collector_dir }}"
    entity: prometheus
    etype: user
    permissions: r
    default: true
    state: present
  when:
    - workstation_host_telemetry_operator_user | length > 0
    - workstation_host_telemetry_host_telemetry_scrape.textfile_collector_dir | default('') | length > 0

# Configures the segment 250 routed libvirt bridge and renders Grafana Alloy config (ADR-143, ADR-144).
# No firewalld ingress rules are opened on segment 250 per ADR-143.
- name: "Section D. Configure host log rendezvous network and Alloy shipper"
  when: workstation_host_telemetry_log_rendezvous_cidr | length > 0
  vars:
    _workstation_host_telemetry_log_rendezvous_host_ip: >-
      {{
        (
          workstation_host_telemetry_log_rendezvous_cidr.split('/')[0].split('.')[:3]
          + [workstation_host_telemetry_vault_bastion.publish_ip.split('.')[3]]
        ) | join('.')
      }}
  block:
    - name: "D1. Define the host log rendezvous network"
      community.libvirt.virt_net:
        uri: qemu:///system
        command: define
        name: "{{ workstation_host_telemetry_host_log_rendezvous.network_name }}"
        xml: "{{ lookup('template', 'host-log-rendezvous-network.xml.j2') }}"

    - name: "D2. Ensure the host log rendezvous network is active"
      community.libvirt.virt_net:
        uri: qemu:///system
        state: active
        name: "{{ workstation_host_telemetry_host_log_rendezvous.network_name }}"

    - name: "D3. Ensure the host log rendezvous network autostarts"
      community.libvirt.virt_net:
        uri: qemu:///system
        autostart: true
        name: "{{ workstation_host_telemetry_host_log_rendezvous.network_name }}"

    - name: "D4. Create the Grafana Alloy configuration and state directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ workstation_host_telemetry_operator_user }}"
        group: "{{ workstation_host_telemetry_operator_user }}"
        mode: "0750"
      loop:
        - "{{ workstation_host_telemetry_repository }}/vault/alloy"
        - "{{ workstation_host_telemetry_repository }}/vault/alloy/data"
      when:
        - workstation_host_telemetry_repository | length > 0
        - workstation_host_telemetry_operator_user | length > 0

    - name: "D5. Render the Grafana Alloy configuration"
      ansible.builtin.template:
        src: alloy-config.alloy.j2
        dest: "{{ workstation_host_telemetry_repository }}/vault/alloy/config.alloy"
        owner: "{{ workstation_host_telemetry_operator_user }}"
        group: "{{ workstation_host_telemetry_operator_user }}"
        mode: "0644"
      when:
        - workstation_host_telemetry_repository | length > 0
        - workstation_host_telemetry_operator_user | length > 0
        - workstation_host_telemetry_log_rendezvous_ip | length > 0
        - workstation_host_telemetry_log_rendezvous_server_names | length > 0

    - name: "D6. Write the pki-root CA certificate for Grafana Alloy TLS verification"
      ansible.builtin.copy:
        content: "{{ workstation_host_telemetry_pki_root_ca_pem }}\n"
        dest: "{{ workstation_host_telemetry_repository }}/vault/alloy/pki-root-ca.pem"
        owner: "{{ workstation_host_telemetry_operator_user }}"
        group: "{{ workstation_host_telemetry_operator_user }}"
        mode: "0644"
      when:
        - workstation_host_telemetry_repository | length > 0
        - workstation_host_telemetry_operator_user | length > 0
        - workstation_host_telemetry_pki_root_ca_pem | length > 0

- name: "C6. Report the terminator and log shipper commands"
  ansible.builtin.debug:
    msg: >-
      Run podman compose restart vault-terminator to load the publish certificate,
      podman compose --profile host-telemetry up -d vault-telemetry-terminator to start telemetry, and
      podman compose --profile host-log-shipper up -d vault-log-shipper to ship server logs.
