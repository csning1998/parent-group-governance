---
# Public contract. Callers MUST inject workstation_libvirt_operator_user from
# the operator account. become: true gathers facts as root, and ansible_facts
# cannot supply the operator name. A hardcoded account name is forbidden.
workstation_libvirt_operator_user: ""

# Bastion Vault guest-reachability segment. Lives outside service_catalog:
# cidr_index must exceed cidr_nat_offset (124), leaving octet 0 of
# 172.16.0.0/24 outside the expressible range of the catalog.
# The bridge address is bastion_vault.publish_address of workstation-topology.yaml.
workstation_libvirt_publish_network:
  name: "vault-bastion-publish"
  netmask: "255.255.255.0"
  # The full RFC 1918 class B private address space. Guests on any service
  # segment reach Bastion Vault through the routed publish network.
  source_cidr: "172.16.0.0/12"

# vault.hcl.j2 renders the listeners of bastion_vault in workstation-topology.yaml, which the playbook loads.
# The CLI injects workstation_libvirt_vault_config_path.
workstation_libvirt_vault:
  config_path: "{{ workstation_libvirt_vault_config_path | default('') }}"

# The scrapers read the Bastion Vault metrics listener and the host exporters which the inventory declares.
# A scraper reaches the host through the gateway of its own segment, hence the rules restrict the source alone.
# An empty scraper_source_cidrs keeps every scrape port closed.
workstation_libvirt_exporter:
  scraper_source_cidrs: []
  host_exporter_ports: []

workstation_libvirt_scrape_ports: >-
  {{ [bastion_vault.metrics_port] + (workstation_libvirt_exporter.host_exporter_ports | default([])) }}

# Seconds which virtnetworkd waits at start for firewalld to report the running state.
workstation_libvirt_firewalld_ready_timeout: 120
