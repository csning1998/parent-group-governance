---
# Defines a dedicated internal network segment for Bastion Vault guest reachability on 172.16.0.0/24.
# service_catalog leaves the subnet unallocated because cidr_index must exceed cidr_nat_offset (124).
- name: "B1. Define Bastion Vault publish network"
  community.libvirt.virt_net:
    uri: qemu:///system
    command: define
    name: "{{ workstation_libvirt_publish_network.name }}"
    xml: "{{ lookup('template', 'publish-network.xml.j2') }}"

- name: "B2. Ensure Bastion Vault publish network is active"
  community.libvirt.virt_net:
    uri: qemu:///system
    state: active
    name: "{{ workstation_libvirt_publish_network.name }}"

- name: "B3. Ensure Bastion Vault publish network autostarts"
  community.libvirt.virt_net:
    uri: qemu:///system
    autostart: true
    name: "{{ workstation_libvirt_publish_network.name }}"
