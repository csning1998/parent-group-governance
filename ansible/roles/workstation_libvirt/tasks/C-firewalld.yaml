---
# Priority -1 with target REJECT preempts libvirt-routed rules, requiring Bastion Vault ingress in libvirt-to-host.
- name: "C1. Declare the policy for routed guest traffic to the host"
  ansible.builtin.template:
    src: libvirt-to-host.xml.j2
    dest: /etc/firewalld/policies/libvirt-to-host.xml
    owner: root
    group: root
    mode: "0644"
  register: _workstation_libvirt_policy_file

# Declaring /etc/firewalld/zones/libvirt.xml overrides the package default libvirt zone to drop ssh and tftp access.
- name: "C2. Declare the zone for NAT guest traffic to the host"
  ansible.builtin.template:
    src: libvirt-zone.xml.j2
    dest: /etc/firewalld/zones/libvirt.xml
    owner: root
    group: root
    mode: "0644"

# Unconditional execution discards transient runtime firewalld bindings even when C1 and C2 report unchanged.
- name: "C3. Reload firewalld to reconcile runtime state with the permanent configuration"
  ansible.builtin.command:
    cmd: firewall-cmd --reload
  changed_when: false

- name: "C4. Read the permanent bindings of the zone trusted"
  ansible.builtin.command:
    cmd: firewall-cmd --permanent --zone=trusted --list-all
  register: _workstation_libvirt_trusted_zone
  check_mode: false
  changed_when: false

# Any interface or source bound to the trusted zone bypasses C1 and C2 by admitting traffic to every host port.
- name: "C5. Assert the zone trusted lacks any binding"
  ansible.builtin.assert:
    that:
      - _workstation_libvirt_trusted_zone.stdout is not search('^\s*(interfaces|sources):[ ]+\S', multiline=true)
    fail_msg: >-
      Permanent firewalld zone "trusted" contains an interface or source binding, exposing every host port.
      Remove the binding with firewall-cmd --permanent --zone=trusted --remove-source or --remove-interface.

- name: "C6. Read the runtime bindings of the zone trusted"
  ansible.builtin.command:
    cmd: firewall-cmd --zone=trusted --list-all
  register: _workstation_libvirt_trusted_zone_runtime
  check_mode: false
  changed_when: false

# Runtime trusted bindings require a direct check because C5 inspects permanent configuration and check mode skips C3.
- name: "C7. Assert the runtime zone trusted lacks any binding"
  ansible.builtin.assert:
    that:
      - _workstation_libvirt_trusted_zone_runtime.stdout is not search('^\s*(interfaces|sources):[ ]+\S', multiline=true)
    fail_msg: >-
      Runtime firewalld zone "trusted" contains an interface or source binding, exposing every host port.
      Remove the binding with firewall-cmd --zone=trusted --remove-source or --remove-interface.

- name: "C8. Read the runtime policy for routed guest traffic to the host"
  ansible.builtin.command:
    cmd: firewall-cmd --info-policy=libvirt-to-host
  register: _workstation_libvirt_policy_info
  check_mode: false
  changed_when: false
  when: not (ansible_check_mode and _workstation_libvirt_policy_file.changed)

# Check mode skips this assertion when C1 reports pending changes because C3 does not execute in check mode.
- name: "C9. Assert the runtime policy matches the declared service and port set"
  ansible.builtin.assert:
    that:
      - _workstation_libvirt_policy_info.stdout is search('^\s*services:\s*dhcp dhcpv6 dns\s*$', multiline=true)
      - _workstation_libvirt_policy_info.stdout is search('port="' ~ workstation_libvirt_vault_bastion.api_port ~ '"')
    fail_msg: >-
      Runtime policy libvirt-to-host differs from libvirt-to-host.xml.j2, which requires dhcp, dhcpv6, dns, and TCP
      port {{ workstation_libvirt_vault_bastion.api_port }}. Rerun C1 and C3.
  when: not (ansible_check_mode and _workstation_libvirt_policy_file.changed)

# Telemetry scrape ports belong exclusively to the host-telemetry-to-host policy.
- name: "C10. Assert the policy for routed guest traffic admits no scrape port"
  ansible.builtin.assert:
    that:
      - _workstation_libvirt_policy_info.stdout is not search('port="' ~ item ~ '"')
    fail_msg: >-
      Runtime policy libvirt-to-host exposes scrape port {{ item }}, which belongs exclusively to
      host-telemetry-to-host. Compare with libvirt-to-host.xml.j2 and rerun C1 and C3.
  loop: "{{ workstation_libvirt_scrape_ports }}"
  when: not (ansible_check_mode and _workstation_libvirt_policy_file.changed)
