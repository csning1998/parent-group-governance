---
- name: "Section 0. Require operator user extra var"
  ansible.builtin.assert:
    that:
      - workstation_libvirt_operator_user is string
      - workstation_libvirt_operator_user | length > 0
      - workstation_libvirt_operator_user != "root"
    fail_msg: >-
      workstation_libvirt_operator_user must be the operator account name.
      become: true gathers facts as root. The CLI injects this extra var.

- name: "Section 0. Require the workstation topology"
  ansible.builtin.assert:
    that:
      - bastion_vault is mapping
      - bastion_vault.publish_address is string
      - bastion_vault.api_port is integer
    fail_msg: >-
      bastion_vault is undefined. The playbook MUST load workstation-topology.yaml of the repository root.

# workstation-backup owns every boot trust object. The TPM binding of the disk encryption is meaningless
# without Secure Boot, hence the trust root refuses the host instead of writing the firmware state.
- name: "Section 0. Read the Secure Boot state"
  ansible.builtin.command:
    argv:
      - mokutil
      - --sb-state
  check_mode: false
  changed_when: false
  register: workstation_libvirt_secure_boot_state

- name: "Section 0. Require Secure Boot"
  ansible.builtin.assert:
    that:
      - "'SecureBoot enabled' in workstation_libvirt_secure_boot_state['stdout']"
    fail_msg: >-
      The Bastion Vault host MUST boot with Secure Boot enabled. Converge the host with
      playbooks/workstation_secure_boot.yaml of workstation-backup before this playbook.

# The publish network requires a running virtnetworkd. A host which enables only
# the socket unit never starts the daemon at boot, which skips libvirt autostart.
- name: "Section A. Enable the libvirt network daemon after firewalld"
  ansible.builtin.include_tasks: A-virtnetworkd.yaml

- name: "Section B. Define the Bastion Vault publish network"
  ansible.builtin.include_tasks: B-publish-network.yaml

- name: "Section C. Restrict guest traffic to the host"
  ansible.builtin.include_tasks: C-firewalld.yaml

- name: "Section D. Grant memlock to the operator user"
  ansible.builtin.include_tasks: D-memlock.yaml

- name: "Section E. Render the Bastion Vault configuration"
  ansible.builtin.include_tasks: E-vault-config.yaml
