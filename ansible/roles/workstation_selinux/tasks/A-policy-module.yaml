---
- name: "Block A1: Policy build tooling"
  block:
    - name: "A1a. Ensure SELinux module build tooling is present"
      ansible.builtin.dnf:
        name:
          - checkpolicy
          - policycoreutils
        state: present

    - name: "A1b. Ensure local SELinux policy directory exists"
      ansible.builtin.file:
        path: "{{ workstation_selinux_local_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

  rescue:
    - name: "Block A1: Policy build tooling failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"

- name: "Block A2: Deploy, compile, and install each policy module"
  block:
    - name: "A2a. Deploy policy module source"
      ansible.builtin.copy:
        src: "{{ item }}.te"
        dest: "{{ workstation_selinux_local_dir }}/{{ item }}.te"
        owner: root
        group: root
        mode: "0600"
      loop: "{{ workstation_selinux_policy_modules }}"
      register: workstation_selinux_policy_source

    - name: "A2b. Query installed SELinux policy modules"
      ansible.builtin.command:
        cmd: semodule -l
      changed_when: false
      register: workstation_selinux_modules

    # Compilation covers a first install and a source revision. semodule --install
    # does not have a check-mode equivalent.
    - name: "A2c. Compile and install each policy module"
      check_mode: false
      ansible.builtin.shell:
        cmd: |
          set -o errexit
          _tmpdir="$(mktemp -d)"
          trap 'rm -rf "${_tmpdir}"' EXIT
          checkmodule -M -m \
            -o "${_tmpdir}/{{ item.item }}.mod" \
            "{{ workstation_selinux_local_dir }}/{{ item.item }}.te"
          semodule_package \
            -o "${_tmpdir}/{{ item.item }}.pp" \
            -m "${_tmpdir}/{{ item.item }}.mod"
          semodule --install "${_tmpdir}/{{ item.item }}.pp"
      loop: "{{ workstation_selinux_policy_source.results }}"
      when: >
        item.changed
        or workstation_selinux_modules.stdout_lines
        | select('match', '^' + item.item + '(\\s|$)')
        | list | length == 0
      changed_when: true

  rescue:
    - name: "Block A2: Deploy, compile, and install policy module failed"
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('see task output above') }}"
