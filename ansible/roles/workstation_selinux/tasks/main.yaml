---
- name: "Section 0. Require the operator home and repository extra vars"
  ansible.builtin.assert:
    that:
      - workstation_selinux_home is string
      - workstation_selinux_home | length > 0
      - workstation_selinux_home != "/root"
      - workstation_selinux_repository is string
      - workstation_selinux_repository is abs
    fail_msg: >-
      workstation_selinux_home must be the operator home directory, and workstation_selinux_repository must be the
      absolute path of the repository checkout. become: true gathers facts as root. The CLI injects both extra vars.

# A parent with NoNewPrivs=1 requires process2 nnp_transition on runtime hops.
- name: "Section A. Install local policy module"
  ansible.builtin.include_tasks: A-policy-module.yaml
  tags:
    - nnp

# Bind-mount sources stay container_file_t:s0 through persistent fcontext mapping.
- name: "Section B. Register anchored fcontext"
  ansible.builtin.include_tasks: B-fcontext.yaml
  tags:
    - fcontext

# Unanchored specs label every matching basename after a filesystem relabel.
- name: "Section C. Remove unanchored fcontext"
  ansible.builtin.include_tasks: C-fcontext-absent.yaml
  tags:
    - fcontext
