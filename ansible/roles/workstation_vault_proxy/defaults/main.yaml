---
# Public contract. The CLI injects every value below. The playbook reads vault_bastion and operator_vault_proxy
# from workstation-topology.yaml.
workstation_vault_proxy_operator_user: ""
# The absolute path of the repository directory vault/tls containing the ML-DSA-87 CA certificate and key.
workstation_vault_proxy_ca_dir: ""
# The CLI derives the GitLab base URL and the top level group path from the origin remote. The role renders both
# into vault-proxy-env.
workstation_vault_proxy_gitlab_url: ""
workstation_vault_proxy_gitlab_top_level_group_path: ""

# Days of validity of each issued certificate, and the remaining days below which the role issues a new one.
workstation_vault_proxy_cert:
  valid_days: 365
  renew_days: 30

# The upper bound in seconds between two login attempts of a Proxy. A Proxy which starts before the cert roles exist
# logs in within this bound after the apply of foundation-vault-bastion, and vault-proxy-env waits as long.
workstation_vault_proxy_login_retry_seconds: 5
