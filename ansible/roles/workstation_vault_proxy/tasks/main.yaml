---
- name: "Section 0. Require the injected values and the workstation topology"
  ansible.builtin.assert:
    that:
      - workstation_vault_proxy_operator_user is string
      - workstation_vault_proxy_operator_user | length > 0
      - workstation_vault_proxy_operator_user != "root"
      - workstation_vault_proxy_ca_dir is match('^/.+/vault/tls$')
      - bastion_vault is mapping
      - operator_proxy is mapping
      - operator_proxy.identities is mapping
    fail_msg: >-
      workstation_vault_proxy needs the operator account and the vault/tls directory, which the CLI injects,
      and workstation-topology.yaml, which the playbook loads.

- name: "Section A. Resolve the operator account and the Proxy directories"
  ansible.builtin.include_tasks: A-operator.yaml

- name: "Section B. Install direnv and the shell hook"
  ansible.builtin.include_tasks: B-direnv.yaml

- name: "Section C. Issue the certificates of each identity from the local CA"
  ansible.builtin.include_tasks: C-certificates.yaml
  loop: "{{ operator_proxy.identities | dict2items }}"
  loop_control:
    loop_var: _workstation_vault_proxy_identity
    label: "{{ _workstation_vault_proxy_identity.key }}"

- name: "Section D. Run one Vault Proxy per identity as a systemd user service"
  ansible.builtin.include_tasks: D-service.yaml

- name: "Section E. Install vault-proxy-env, which prints the environment of an identity"
  ansible.builtin.include_tasks: E-env.yaml
