---
networks:
  sonarqube-internal:
    driver: bridge
  # Literal network name. gitlab-runner [runners.docker] network_mode references this name.
  # Job containers reach SonarQube by service name without host port exposure.
  sonarqube-ci-net:
    name: sonarqube-ci-net
    driver: bridge

services:
  commitlint:
    image: registry.gitlab.com/csning1998/gitlab-ci-with-code-reviewer/reviewer:edge
    working_dir: /repo
    volumes:
      - ${REPO_GIT_DIR}:/repo/.git:ro
      - ${MSG_FILE}:/repo/.git/COMMIT_EDITMSG_HOOK:ro
    command: commitlint --config /etc/commitlint/commitlint.config.cjs --cwd /repo --edit .git/COMMIT_EDITMSG_HOOK

  gitleaks:
    image: docker.io/zricethezav/gitleaks:v8.30.1
    working_dir: /repo
    volumes:
      - ${REPO_GIT_DIR}:/repo/.git
      - ./.gitleaks.toml:/repo/.gitleaks.toml:ro
    command: protect --staged --redact -v

  gitlab-runner:
    image: docker.io/gitlab/gitlab-runner:v19.0.1
    container_name: parent-group-governance-gitlab-runner
    network_mode: "host"
    restart: always
    # Reaching the rootless podman socket requires the connectto permission that the
    # gitlab_runner_podman policy module grants exclusively to this SELinux type.
    security_opt:
      - label=type:container_engine_t
    volumes:
      - ./gitlab-runner-configs:/etc/gitlab-runner
      - /run/user/${HOST_UID}/podman/podman.sock:/run/podman/podman.sock

  vault-server:
    image: docker.io/hashicorp/vault:2.0
    container_name: parent-group-governance-vault-bastion
    # vault.hcl binds listener address 172.16.0.1, which host-mode netns can delay until after PID 1 starts.
    # Vault exits when any tcp listener bind fails.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        while [ "$$i" -lt 150 ]
        do
          if ip -4 addr show to 172.16.0.1 2>/dev/null | grep -q 'inet 172.16.0.1/'
          then
            exec vault server -config=/opt/vault/vault.hcl
          fi
          i=$$((i + 1))
          sleep 0.2
        done
        echo 'timed out waiting for 172.16.0.1 in the host namespace' >&2
        exit 1
    volumes:
      - ./vault/vault.hcl:/opt/vault/vault.hcl
      - ./vault/data:/opt/vault/data
      - ./vault/tls:/opt/vault/tls
    user: "${HOST_UID}:${HOST_GID}"
    cap_add:
      - IPC_LOCK
    network_mode: "host"
    userns_mode: keep-id
    restart: always
    environment:
      - SKIP_SETCAP=true
      - VAULT_ADDR=https://172.16.0.1:8200
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "vault status -address=https://172.16.0.1:8200 -tls-skip-verify || [ $$? -eq 2 ]",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  sonarqube-db:
    image: docker.io/library/postgres:18-alpine3.24
    container_name: parent-group-governance-sonarqube-postgres
    networks:
      - sonarqube-internal
    environment:
      - POSTGRES_USER=sonarqube
      - POSTGRES_PASSWORD=${SONARQUBE_DB_PASSWORD}
      - POSTGRES_DB=sonarqube
    volumes:
      - ./sonarqube/postgres-data:/var/lib/postgresql
    restart: always

  sonarqube:
    image: docker.io/library/sonarqube:26.7.0.124771-community
    container_name: parent-group-governance-sonarqube
    depends_on:
      - sonarqube-db
    userns_mode: keep-id
    networks:
      - sonarqube-internal
      - sonarqube-ci-net
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonarqube
      - SONAR_JDBC_PASSWORD=${SONARQUBE_DB_PASSWORD}
    volumes:
      - ./sonarqube/data:/opt/sonarqube/data
      - ./sonarqube/extensions:/opt/sonarqube/extensions
      - ./sonarqube/logs:/opt/sonarqube/logs
    restart: always
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
