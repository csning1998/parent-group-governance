---
networks:
  sonarqube-internal:
    driver: bridge
  # Literal network name. gitlab-runner [runners.docker] network_mode references this name.
  # Job containers reach SonarQube by service name without host port exposure.
  sonarqube-ci-net:
    name: sonarqube-ci-net
    driver: bridge

services:
  gitlab-runner:
    image: docker.io/gitlab/gitlab-runner:v19.0.1
    container_name: parent-group-governance-gitlab-runner
    network_mode: "host"
    restart: always
    # Reaching the rootless podman socket requires the connectto permission, which the
    # gitlab_runner_podman policy module grants exclusively to this SELinux type.
    security_opt:
      - label=type:container_engine_t
    volumes:
      - ./gitlab-runner-configs:/etc/gitlab-runner
      - /run/user/${HOST_UID}/podman/podman.sock:/run/podman/podman.sock

  vault-server:
    image: docker.io/hashicorp/vault:2.2.0
    container_name: parent-group-governance-vault-bastion
    # Vault starts without waiting for the publish network, since every listener in vault.hcl binds loopback.
    entrypoint: ["vault", "server", "-config=/opt/vault/vault.hcl"]
    # Ansible role workstation_libvirt renders VAULT_ADDR from the loopback listener in workstation-topology.yaml.
    env_file:
      - ./vault/vault.env
    volumes:
      - ./vault/vault.hcl:/opt/vault/vault.hcl
      - ./vault/data:/opt/vault/data
      - ./vault/tls:/opt/vault/tls
      # Mounts the host directory receiving the file audit log configured by foundation-vault-bastion.
      - ./vault/audit:/opt/vault/audit
    user: "${HOST_UID}:${HOST_GID}"
    cap_add:
      - IPC_LOCK
    network_mode: "host"
    userns_mode: keep-id
    restart: always
    environment:
      - SKIP_SETCAP=true
    healthcheck:
      test: ["CMD-SHELL", "vault status -tls-skip-verify || [ $$? -eq 2 ]"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The TLS terminator binds the publish address to enforce ML-KEM-1024 key exchange.
  # The terminator shares the host namespace with vault-server, since the PROXY protocol backend binds loopback.
  vault-terminator:
    build:
      context: ./vault/terminator
    image: localhost/parent-group-governance-vault-terminator:latest
    container_name: parent-group-governance-vault-bastion-terminator
    # HAProxy running as PID 1 ignores SIGTERM. Container init forwards the signal to HAProxy.
    init: true
    # The entrypoint polls for the publish address before starting HAProxy, since libvirt assigns the address asynchronously.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        while [ "$$i" -lt 150 ]
        do
          if ip -4 addr show to "$$TERMINATOR_PUBLISH_ADDRESS" 2>/dev/null | grep -q "inet $$TERMINATOR_PUBLISH_ADDRESS/"
          then
            exec haproxy -db -f /etc/haproxy/haproxy.cfg
          fi
          i=$$((i + 1))
          sleep 0.2
        done
        echo "timed out waiting for $$TERMINATOR_PUBLISH_ADDRESS in the host namespace" >&2
        exit 1
    # Ansible role workstation_libvirt renders the environment files from workstation-topology.yaml.
    env_file:
      - ./vault/terminator/terminator.env
    # Mounting certificate files selectively isolates the CA private keys from the terminator container.
    volumes:
      - ./vault/terminator/haproxy.cfg:/etc/haproxy/haproxy.cfg:ro
      - ./vault/tls/publish.pem:/etc/haproxy/tls/publish.pem:ro
      - ./vault/tls/publish-key.pem:/etc/haproxy/tls/publish-key.pem:ro
      - ./vault/tls/ca-ml-dsa-87.pem:/etc/haproxy/tls/ca-ml-dsa-87.pem:ro
      - ./vault/tls/terminator-client.pem:/etc/haproxy/tls/terminator-client.pem:ro
      - ./vault/tls/terminator-client-key.pem:/etc/haproxy/tls/terminator-client-key.pem:ro
    user: "${HOST_UID}:${HOST_GID}"
    network_mode: "host"
    userns_mode: keep-id
    restart: always

  # The telemetry terminator serves the metrics on the host telemetry scrape address in a separate HAProxy process.
  vault-telemetry-terminator:
    image: localhost/parent-group-governance-vault-terminator:latest
    container_name: parent-group-governance-vault-bastion-telemetry-terminator
    init: true
    profiles: ["host-telemetry"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        while [ "$$i" -lt 150 ]
        do
          if ip -4 addr show to "$$TERMINATOR_SCRAPE_ADDRESS" 2>/dev/null | grep -q "inet $$TERMINATOR_SCRAPE_ADDRESS/"
          then
            exec haproxy -db -f /etc/haproxy/haproxy.cfg
          fi
          i=$$((i + 1))
          sleep 0.2
        done
        echo "timed out waiting for $$TERMINATOR_SCRAPE_ADDRESS in the host namespace" >&2
        exit 1
    env_file:
      - ./vault/terminator/terminator.env
    volumes:
      - ./vault/terminator/haproxy-telemetry.cfg:/etc/haproxy/haproxy.cfg:ro
      - ./vault/tls/publish.pem:/etc/haproxy/tls/publish.pem:ro
      - ./vault/tls/publish-key.pem:/etc/haproxy/tls/publish-key.pem:ro
      - ./vault/tls/ca-ml-dsa-87.pem:/etc/haproxy/tls/ca-ml-dsa-87.pem:ro
    user: "${HOST_UID}:${HOST_GID}"
    network_mode: "host"
    userns_mode: keep-id
    restart: always

  sonarqube-db:
    image: docker.io/library/postgres:18-alpine3.24
    container_name: parent-group-governance-sonarqube-postgres
    networks:
      - sonarqube-internal
    environment:
      - POSTGRES_USER=sonarqube
      - POSTGRES_PASSWORD=${SONARQUBE_DB_PASSWORD}
      - POSTGRES_DB=sonarqube
    volumes:
      - ./sonarqube/postgres-data:/var/lib/postgresql
    restart: always

  sonarqube:
    image: docker.io/library/sonarqube:26.7.0.124771-community
    container_name: parent-group-governance-sonarqube
    depends_on:
      - sonarqube-db
    userns_mode: keep-id
    networks:
      - sonarqube-internal
      - sonarqube-ci-net
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonarqube
      - SONAR_JDBC_USERNAME=sonarqube
      - SONAR_JDBC_PASSWORD=${SONARQUBE_DB_PASSWORD}
    volumes:
      - ./sonarqube/data:/opt/sonarqube/data
      - ./sonarqube/extensions:/opt/sonarqube/extensions
      - ./sonarqube/logs:/opt/sonarqube/logs
    restart: always
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
