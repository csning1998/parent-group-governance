---
# Declares every infrastructure account password `./governance` rotates against Bastion Vault.
# The optional `vault.address` overrides BASTION_VAULT_ADDR from .env file.
vault:
  address: "https://172.16.0.1:8200"

credentials:
  - key: sonarqube-admin-password
    vault_kv_mount: secret
    vault_kv_path: parent-group-governance/infrastructure/credentials/sonarqube
    length: 24
    service:
      mechanism: http_form
      endpoint: http://127.0.0.1:9000/api/users/change_password
      login: admin
      factory_default_password: admin
