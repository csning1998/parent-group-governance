# Shared scanner baseline read by build-governance.sh and the security:sonarqube CI job.
# Both callers pass sonar.projectKey on the command line from the project path slug to avoid hardcoding the group path.
# The CI job also overrides sonar.tests and sonar.test.inclusions.
sonar.sources=tools,terraform,ansible
sonar.tests=tools,ansible
sonar.test.inclusions=**/*_test.go,**/tests/test_*.py
sonar.exclusions=**/testdata/**,**/.terraform/**,**/*_test.go,**/tests/test_*.py
sonar.go.coverage.reportPaths=tools/governance/coverage.out
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.14
