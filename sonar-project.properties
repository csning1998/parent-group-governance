# build-governance.sh and the CI job security:sonarqube read the declarations below.
# The CI job overrides sonar.projectKey, sonar.tests, and sonar.test.inclusions on the command line.
sonar.projectKey=csning1998-lab-parent-group-governance
sonar.projectName=csning1998-lab-parent-group-governance
sonar.sources=tools,terraform,ansible
sonar.tests=tools,ansible
sonar.test.inclusions=**/*_test.go,**/tests/test_*.py
sonar.exclusions=**/testdata/**,**/.terraform/**,**/*_test.go,**/tests/test_*.py
sonar.go.coverage.reportPaths=tools/governance/coverage.out
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.version=3.14
