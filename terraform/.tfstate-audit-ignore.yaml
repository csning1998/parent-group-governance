---
# Locations which a provider marks sensitive while the value is public. See tools/governance/README.md Section 11.
ignores:
  - layer: foundation-vault-bastion
    address: data.vault_generic_secret.platform_trust
    path: data_json
    detection: sensitive-attribute
    reason: The platform trust facts are network CIDRs, stages, and the domain suffix.
  - layer: foundation-vault-bastion
    address: data.vault_generic_secret.platform_trust
    path: data.bastion_publish_cidr
    detection: sensitive-attribute
    reason: A network CIDR of the platform trust facts.
  - layer: foundation-vault-bastion
    address: data.vault_generic_secret.platform_trust
    path: data.domain_suffix
    detection: sensitive-attribute
    reason: The public domain suffix of the platform trust facts.
  - layer: foundation-vault-bastion
    address: data.vault_generic_secret.platform_trust
    path: data.network_cidr
    detection: sensitive-attribute
    reason: A network CIDR of the platform trust facts.
  - layer: foundation-vault-bastion
    address: data.vault_generic_secret.platform_trust
    path: data.stages
    detection: sensitive-attribute
    reason: The stage names of the platform trust facts.
  - layer: foundation-vault-bastion
    address: vault_kv_secret_v2.registry_platform_trust
    path: data_json
    detection: sensitive-attribute
    reason: The registry republishes the platform trust facts.
  - layer: foundation-vault-bastion
    address: vault_kv_secret_v2.registry_tenant_bastion["meta-platform"]
    path: data_json
    detection: sensitive-attribute
    reason: The registry holds endpoints, mount paths, policy names, and public certificates.
  - layer: meta-gitlab-project
    address: module.workload_identity_federation.vault_kv_secret_v2.binding["anthropic"]
    path: data_json
    detection: sensitive-attribute
    reason: The binding holds federation identifiers, which grant nothing without a signed CI job token.
  - layer: meta-gitlab-project
    address: module.workload_identity_federation.vault_kv_secret_v2.binding["azure"]
    path: data_json
    detection: sensitive-attribute
    reason: The binding holds federation identifiers, which grant nothing without a signed CI job token.
  - layer: meta-gitlab-project
    address: module.workload_identity_federation.vault_kv_secret_v2.binding["google"]
    path: data_json
    detection: sensitive-attribute
    reason: The binding holds federation identifiers, which grant nothing without a signed CI job token.
  - layer: meta-gitlab-project
    address: module.github_mirror.gitlab_project_push_mirror.this
    path: url
    detection: sensitive-attribute
    reason: The mirror URL uses the SSH scheme and carries no password.
