---
# Locations which a provider marks sensitive while the value is public.
# Refer to tools/governance/README.md Section 11.
ignores:
  foundation-vault-bastion:
    - address: data.vault_generic_secret.network_allocation
      paths:
        - data.bastion_publish_cidr
        - data.domain_suffix
        - data.network_cidr
        - data.network_baseline
        - data.stages
      reason: The network allocation facts are network CIDRs, stages, the domain suffix, and the host network baseline.

    - address: vault_kv_secret_v2.registry_platform_network_allocation
      paths:
        - data_json.bastion_publish_cidr
        - data_json.domain_suffix
        - data_json.network_cidr
        - data_json.stage_domains
        - data_json.host_telemetry_scrape_cidr
        - data_json.host_telemetry_scrape_address
        - data_json.host_log_rendezvous_cidr
        - data_json.host_log_rendezvous_address
        - data_json.host_log_rendezvous_server_names
        - data_json.network_baseline
      reason: The registry republishes the network allocation facts, the host segments, and the network baseline.

    - address: vault_kv_secret_v2.registry_tenant_bastion["platform-foundation"]
      paths:
        - data_json.assignable_policies
        - data_json.pki
        - data_json.transit_unseal
        - data_json.vault
      reason: The registry holds endpoints, mount paths, policy names, and public certificates.

  group-ai-provider-anthropic:
    - address: vault_kv_secret_v2.registry_platform_ai_provider_anthropic
      paths:
        - data_json.issuer_id
        - data_json.organization_id
      reason: The registry publishes the federation issuer and organization identifiers, which carry no credential.

  group-ai-provider-google-cloud:
    - address: vault_kv_secret_v2.registry_platform_ai_provider_google_cloud
      paths:
        - data_json.project_id
        - data_json.project_number
        - data_json.pool_id
        - data_json.provider_id
      reason: The registry publishes the project and workload identity pool identifiers, which carry no credential.

  group-ai-provider-azure:
    - address: vault_kv_secret_v2.registry_platform_ai_provider_azure
      paths:
        - data_json.tenant_id
        - data_json.subscription_id
        - data_json.cognitive_account_id
        - data_json.openai_endpoint
      reason: The registry publishes the tenant, subscription, and account identifiers and the endpoint, without credential.

  group-foundation:
    - address: vault_kv_secret_v2.registry_platform_gitlab_group_top_level
      paths:
        - data_json.group_id
        - data_json.full_path
      reason: The registry publishes the identifier and path of the public top-level group, which carry no credential.

  group-topology:
    - address: vault_kv_secret_v2.registry_platform_gitlab_group_subgroups
      paths:
        - data_json.subgroup_ids
      reason: The registry publishes the subgroup identifiers, which carry no credential.

  administration-gitlab-project:
    - address: module.github_mirror.gitlab_project_push_mirror.this
      path: url
      reason: The mirror URL uses the SSH scheme and carries no password.
