---
vault:
  address: "https://vault.example.internal:8200"

credentials:
  - key: sonarqube-password
    vault_kv_mount: secret
    vault_kv_path: parent-group-governance/infrastructure
    length: 24
    service:
      mechanism: http_form
      endpoint: http://127.0.0.1:9000/api/users/change_password
      login: admin
      factory_default_password: admin
