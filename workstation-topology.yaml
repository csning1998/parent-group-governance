---
# Declarative topology configuration for the local workstation Bastion Vault and operational identities.
# Specification and engineering references: documentation/workstation-topology-specification.md

# Infrastructure Plane: Network listener bindings for Bastion Vault.
bastion_vault:
  loopback_address: "127.0.0.1"
  publish_address: "172.16.0.1"
  api_port: 8200
  cluster_port: 8201
  metrics_port: 8202

# Access Plane: Local forwarding proxies mediating mTLS client authentication.
operator_vault_proxy:
  cert_auth_mount: "operator-cert"
  user_config_dir: ".config/vault-proxy"
  placeholder_token: "proxy-supplied"
  state_backend:
    vault_kv_mount: "secret"
    vault_kv_field: "token"
    terraform_http_username: "gitlab-ci-token"
  identities:
    credential-distributor:
      listen_port: 8210
      access_tier: "credential-distributor"
      owner_code: "parent-group-governance"
      state_backend_path: "parent-group-governance/terraform/state-backend"
      allowed_read_secret_paths:
        - "parent-group-governance/ai-provider-console/anthropic"
        - "parent-group-governance/github/publication"
        - "parent-group-governance/sonarqube/ci-analysis-bot"
        - "gitlab-ci-with-code-reviewer/integration/code-reviewer-bot"
        - "gitlab-ci-with-code-reviewer/integration/auto-version-tag-bot"
        - "gitlab-ci-with-code-reviewer/terraform/state-backend"
      allowed_write_secret_paths: []
      allowed_read_registry_paths:
        - "platform/ai-provider"
    platform-foundation:
      listen_port: 8211
      access_tier: "tenant"
      owner_code: "platform-foundation"
      state_backend_path: "platform-foundation/terraform/state-backend"
    administrator:
      listen_port: 8212
      access_tier: "administrator"
      owner_code: "parent-group-governance"
      state_backend_path: "parent-group-governance/terraform/state-backend"
    credential-rotator:
      listen_port: 8213
      access_tier: "credential-rotator"
      owner_code: "parent-group-governance"
    credential-distributor-platform-foundation:
      listen_port: 8214
      access_tier: "credential-distributor"
      owner_code: "platform-foundation"
      state_backend_path: "platform-foundation/terraform/state-backend"
      allowed_read_secret_paths:
        - "parent-group-governance/ai-provider-console/anthropic"
        - "parent-group-governance/github/publication"
        - "parent-group-governance/sonarqube/ci-analysis-bot"
        - "gitlab-ci-with-code-reviewer/integration/code-reviewer-bot"
        - "gitlab-ci-with-code-reviewer/integration/auto-version-tag-bot"
      allowed_write_secret_paths: []
      allowed_read_registry_paths:
        - "platform/ai-provider"
        - "platform/gitlab-group"
    credential-distributor-opgitlab:
      listen_port: 8215
      access_tier: "credential-distributor"
      owner_code: "opgitlab"
      state_backend_path: "opgitlab/terraform/state-backend"
      allowed_read_secret_paths:
        - "parent-group-governance/ai-provider-console/anthropic"
        - "parent-group-governance/github/publication"
        - "parent-group-governance/sonarqube/ci-analysis-bot"
        - "gitlab-ci-with-code-reviewer/integration/code-reviewer-bot"
        - "gitlab-ci-with-code-reviewer/integration/auto-version-tag-bot"
      allowed_write_secret_paths: []
      allowed_read_registry_paths:
        - "platform/ai-provider"
        - "platform/gitlab-group"
    credential-distributor-gitlab-ci-with-code-reviewer:
      listen_port: 8216
      access_tier: "credential-distributor"
      owner_code: "gitlab-ci-with-code-reviewer"
      state_backend_path: "gitlab-ci-with-code-reviewer/terraform/state-backend"
      allowed_read_secret_paths:
        - "parent-group-governance/ai-provider-console/anthropic"
        - "parent-group-governance/github/publication"
        - "parent-group-governance/sonarqube/ci-analysis-bot"
        - "gitlab-ci-with-code-reviewer/integration/code-reviewer-bot"
        - "gitlab-ci-with-code-reviewer/integration/auto-version-tag-bot"
      allowed_write_secret_paths: []
      allowed_read_registry_paths:
        - "platform/ai-provider"
        - "platform/gitlab-group"
    credential-distributor-generic-agent-criteria-source:
      listen_port: 8217
      access_tier: "credential-distributor"
      owner_code: "generic-agent-criteria-source"
      state_backend_path: "generic-agent-criteria-source/terraform/state-backend"
      allowed_read_secret_paths:
        - "parent-group-governance/ai-provider-console/anthropic"
        - "parent-group-governance/github/publication"
        - "parent-group-governance/sonarqube/ci-analysis-bot"
        - "gitlab-ci-with-code-reviewer/integration/code-reviewer-bot"
        - "gitlab-ci-with-code-reviewer/integration/auto-version-tag-bot"
      allowed_write_secret_paths: []
      allowed_read_registry_paths:
        - "platform/ai-provider"
    consumer-opgitlab:
      listen_port: 8218
      access_tier: "consumer"
      owner_code: "opgitlab"
      state_backend_path: "opgitlab/terraform/state-backend"
      allowed_read_registry_paths:
        - "platform/network"
    consumer-platform-observability:
      listen_port: 8219
      access_tier: "consumer"
      owner_code: "platform-observability"
      state_backend_path: "platform-observability/terraform/state-backend"
      allowed_read_registry_paths:
        - "platform/gitlab-group"
    credential-distributor-personal:
      listen_port: 8220
      access_tier: "credential-distributor"
      owner_code: "personal"
      state_backend_path: "personal/terraform/state-backend"
      allowed_read_secret_paths:
        - "parent-group-governance/ai-provider-console/anthropic"
        - "parent-group-governance/github/publication"
        - "gitlab-ci-with-code-reviewer/integration/code-reviewer-bot"
        - "gitlab-ci-with-code-reviewer/integration/auto-version-tag-bot"
      allowed_write_secret_paths: []
      allowed_read_registry_paths:
        - "platform/ai-provider"
        - "platform/gitlab-group"
    credential-distributor-terraform-provider-sshclient:
      listen_port: 8221
      access_tier: "credential-distributor"
      owner_code: "terraform-provider-sshclient"
      state_backend_path: "terraform-provider-sshclient/terraform/state-backend"
      allowed_read_secret_paths:
        - "parent-group-governance/ai-provider-console/anthropic"
        - "gitlab-ci-with-code-reviewer/integration/code-reviewer-bot"
        - "gitlab-ci-with-code-reviewer/integration/auto-version-tag-bot"
      allowed_write_secret_paths: []
      allowed_read_registry_paths:
        - "platform/ai-provider"
        - "platform/gitlab-group"

# Credential Lifecycle Plane: Automated service password rotation registry.
service_admin_passwords:
  - key: sonarqube-admin-password
    vault_kv_mount: secret
    vault_kv_path: parent-group-governance/sonarqube/admin-account
    length: 24
    service:
      mechanism: http_form
      rotate_endpoint: http://127.0.0.1:9000/api/users/change_password
      verify_endpoint: http://127.0.0.1:9000/api/authentication/validate
      admin_username: admin
      factory_default_password: admin
