---
# Declarative topology configuration for the local workstation Bastion Vault and operational identities.
# Specification and engineering references: documentation/workstation-topology-specification.md

# Infrastructure Plane: Network listener bindings for Bastion Vault.
bastion_vault:
  loopback_address: "127.0.0.1"
  publish_address: "172.16.0.1"
  api_port: 8200
  cluster_port: 8201
  metrics_port: 8202

# Access Plane: Local forwarding proxies mediating mTLS client authentication.
operator_vault_proxy:
  cert_auth_mount: "operator-cert"
  user_config_dir: ".config/vault-proxy"
  placeholder_token: "proxy-supplied"
  state_backend:
    vault_kv_mount: "secret"
    vault_kv_path: "parent-group-governance/terraform/state-backend"
    vault_kv_field: "token"
    terraform_http_username: "gitlab-ci-token"
  identities:
    credential-distributor:
      listen_port: 8210
      access_tier: "credential-distributor"
      allowed_read_secret_paths:
        - "parent-group-governance/ai-provider-console/anthropic"
        - "parent-group-governance/github/publication"
        - "parent-group-governance/sonarqube/ci-analysis-bot"
        - "gitlab-ci-with-code-reviewer/integration/code-reviewer-bot"
        - "gitlab-ci-with-code-reviewer/integration/auto-version-tag-bot"
        - "gitlab-ci-with-code-reviewer/terraform/state-backend"
      allowed_write_secret_paths: []
    platform-foundation:
      listen_port: 8211
      access_tier: "tenant"
    administrator:
      listen_port: 8212
      access_tier: "administrator"
    credential-rotator:
      listen_port: 8213
      access_tier: "credential-rotator"

# Credential Lifecycle Plane: Automated service password rotation registry.
service_admin_passwords:
  - key: sonarqube-admin-password
    vault_kv_mount: secret
    vault_kv_path: parent-group-governance/sonarqube/admin-account
    length: 24
    service:
      mechanism: http_form
      rotate_endpoint: http://127.0.0.1:9000/api/users/change_password
      verify_endpoint: http://127.0.0.1:9000/api/authentication/validate
      admin_username: admin
      factory_default_password: admin
