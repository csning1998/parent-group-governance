---
# Declarative topology configuration for the local workstation Bastion Vault and operational identities.
# Specification and engineering references: documentation/workstation-topology-specification.md

# Infrastructure Plane: Network listener bindings for Bastion Vault.
vault_bastion:
  loopback_address: "127.0.0.1"
  publish_address: "172.16.0.1"
  api_port: 8200
  cluster_port: 8201
  metrics_port: 8202
  # Vault allocates a cluster listener one port above each API listener, reserving port 8203 for the metrics listener.
  publish_backend_port: 8204

# Observability Plane: the host segment on which scrapers reach the metrics of the host, see ADR-143.
# foundation-vault-bastion publishes the segment and the host address at the registry location below.
host_telemetry_scrape:
  network_name: "host-telemetry-scrape"
  registry:
    vault_kv_mount: "registry"
    vault_kv_path: "platform/network/allocation"
    cidr_field: "host_telemetry_scrape_cidr"
    address_field: "host_telemetry_scrape_address"
  # The ports of node_exporter and the libvirt exporter on this host.
  host_exporter_ports: [9100, 9177]

# Access Plane: Local forwarding proxies mediating mTLS client authentication.
# The identity name determines the access tier and the owner code, see documentation/workstation-topology-specification.md.
operator_vault_proxy:
  governance_owner_code: "parent-group-governance"
  cert_auth_mount: "operator-cert"
  user_config_dir: ".config/vault-proxy"
  placeholder_token: "proxy-supplied"
  state_backend:
    vault_kv_mount: "secret"
    vault_kv_field: "token"
    terraform_http_username: "gitlab-ci-token"
    project_ids:
      parent-group-governance: "86417732"
      platform-foundation: "84608830"
      opgitlab: "82448331"
      gitlab-ci-with-code-reviewer: "83083739"
      generic-agent-criteria-source: "85419450"
      platform-observability: "87321619"
      terraform-provider-sshclient: "86090557"
  identities:
    credential-distributor-parent-group-governance:
      listen_port: 8210
      allowed_read_secret_paths: &organization_secret_reads
        - "parent-group-governance/ai-provider-console/anthropic"
        - "parent-group-governance/github/publication"
        - "parent-group-governance/sonarqube/ci-analysis-bot"
      allowed_write_secret_paths: []
      allowed_read_registry_paths:
        - "platform/ai-provider"
      code_reviewer_variable_projects:
        - "parent-group-governance"
    platform-foundation:
      listen_port: 8211
    administrator:
      listen_port: 8212
    credential-rotator:
      listen_port: 8213
    credential-distributor-platform-foundation:
      listen_port: 8214
      allowed_read_secret_paths: *organization_secret_reads
      allowed_write_secret_paths: []
      allowed_read_registry_paths: &platform_registry_reads
        - "platform/ai-provider"
        - "platform/gitlab-group"
      code_reviewer_variable_projects:
        - "platform-engineering-lab/platform-foundation"
    credential-distributor-opgitlab:
      listen_port: 8215
      allowed_read_secret_paths: *organization_secret_reads
      allowed_write_secret_paths: []
      allowed_read_registry_paths: *platform_registry_reads
      code_reviewer_variable_projects:
        - "platform-engineering-lab/on-premise-gitlab-deployment"
    credential-distributor-gitlab-ci-with-code-reviewer:
      listen_port: 8216
      allowed_read_secret_paths: *organization_secret_reads
      allowed_write_secret_paths: []
      allowed_read_registry_paths: *platform_registry_reads
      code_reviewer_variable_projects:
        - "gitlab-ci-with-code-reviewer"
    credential-distributor-generic-agent-criteria-source:
      listen_port: 8217
      allowed_read_secret_paths: *organization_secret_reads
      allowed_write_secret_paths: []
      allowed_read_registry_paths:
        - "platform/ai-provider"
      code_reviewer_variable_projects:
        - "platform-engineering-lab/generic-agent-criteria-source"
    consumer-opgitlab:
      listen_port: 8218
      allowed_read_registry_paths:
        - "platform/network"
    consumer-platform-observability:
      listen_port: 8219
      allowed_read_registry_paths:
        - "platform/gitlab-group"
    credential-distributor-personal:
      listen_port: 8220
      allowed_read_secret_paths: *organization_secret_reads
      allowed_write_secret_paths: []
      allowed_read_registry_paths: *platform_registry_reads
      code_reviewer_variable_projects:
        - "personal/app-content-matter"
        - "personal/LaTeX_Documents"
        - "personal/second-brain"
    credential-distributor-terraform-provider-sshclient:
      listen_port: 8221
      allowed_read_secret_paths:
        - "parent-group-governance/ai-provider-console/anthropic"
      allowed_write_secret_paths: []
      allowed_read_registry_paths: *platform_registry_reads
      code_reviewer_variable_projects:
        - "platform-engineering-lab/utilities/terraform-provider-sshclient"
    credential-distributor-platform-observability:
      listen_port: 8222
      allowed_read_secret_paths: *organization_secret_reads
      allowed_write_secret_paths: []
      allowed_read_registry_paths: *platform_registry_reads

# Credential Lifecycle Plane: Automated service password rotation registry.
service_admin_passwords:
  - key: sonarqube-admin-password
    vault_kv_mount: secret
    vault_kv_path: parent-group-governance/sonarqube/admin-account
    length: 24
    service:
      mechanism: http_form
      rotate_endpoint: http://127.0.0.1:9000/api/users/change_password
      verify_endpoint: http://127.0.0.1:9000/api/authentication/validate
      admin_username: admin
      factory_default_password: admin

# Credential Issuance Plane: tokens issued by SonarQube and GitLab,
# and written into the Bastion Vault and GitLab via ./governance.
service_issued_tokens:
  gitlab_group_registry:
    vault_kv_mount: "registry"
    vault_kv_path: "platform/gitlab-group/top-level"
    vault_kv_field: "group_id"
  sonarqube_analysis_token:
    user_tokens_endpoint: "http://127.0.0.1:9000/api/user_tokens"
    admin_password_key: "sonarqube-admin-password"
    token_name_prefix: "gitlab-ci-analysis"
    vault:
      vault_kv_mount: "secret"
      vault_kv_path: "parent-group-governance/sonarqube/ci-analysis-bot"
      vault_kv_field: "sonarqube_ci_token"
    gitlab_group_variable_key: "SONAR_TOKEN"
  gitlab_group_runner:
    description: "parent-group-governance-shared-podman-runner"
    tag_list: ["podman", "local", "sonarqube-network"]
    config_path: "gitlab-runner-configs/config.toml"
  code_reviewer_variables:
    bot_tokens:
      - vault:
          vault_kv_mount: "secret"
          vault_kv_path: "gitlab-ci-with-code-reviewer/integration/code-reviewer-bot"
          vault_kv_field: "token"
        variable_keys:
          ["REVIEW_MR_REVIEWER", "CLAUDE_MR_REVIEWER", "GEMINI_MR_REVIEWER"]
      - vault:
          vault_kv_mount: "secret"
          vault_kv_path: "gitlab-ci-with-code-reviewer/integration/auto-version-tag-bot"
          vault_kv_field: "token"
        variable_keys: ["TAG_PUSH_TOKEN"]
